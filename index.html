<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
/* Layout: a handheld — the HD-2D yard scene up top, JRPG menu windows stacked below, a command bar pinned to the bottom */
:root{
  color-scheme: dark;
  /* palette: night yard under sodium floodlights, JRPG blue windows, jumpsuit orange */
  --ink:#0b0d1a;
  --ink-2:#121631;
  --win-top:#1d2b6e;
  --win-bot:#0d1540;
  --win-edge:#07102f;
  --frame:#e1e7ff;
  --line:#2f3c7a;
  --ghost:#243270;
  --text:#f5efe0;
  --muted:#a7b1da;
  --dim:#6d77a6;
  --amber:#ffc54a;
  --amber-hi:#fff0b0;
  --amber-deep:#c98a1c;
  --orange:#ff7a1f;
  --orange-deep:#b84a06;
  --good:#5fe08e;
  --bad:#ff4a5c;
  --bad-deep:#a3182a;
  --steel:#7d93c7;
  --on-accent:#1a0e05;
  --card:#f6f1e4;
  --card-ink:#151021;
  --card-red:#d3283a;
  --mesh:rgba(125,147,199,.055);
  --shadow:rgba(0,0,0,.55);
  --shade:rgba(0,0,0,.28);
  --btn-hi:rgba(255,255,255,.32);
  --chip:rgba(4,8,30,.35);
  --chip-on:rgba(255,197,74,.12);
  --field:#0a0f2b;
  --hud-bg:rgba(7,10,32,.78);
  --scrim:rgba(4,5,14,.74);
  --ray:rgba(255,197,74,.13);
  /* type */
  --font-display:"Jersey 10","Impact","Haettenschweiler","Arial Narrow",sans-serif;
  --font-ui:"DotGothic16","MS Gothic","Osaka-Mono","Courier New",monospace;
  --notch:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  --octa:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ink);color:var(--text);
  font-family:var(--font-ui);font-size:16px;line-height:1.4;
  background-image:repeating-linear-gradient(45deg,var(--mesh) 0 1px,transparent 1px 15px),repeating-linear-gradient(-45deg,var(--mesh) 0 1px,transparent 1px 15px);
}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.muted{color:var(--muted)}
.center{text-align:center}
.fine{font-size:12px;color:var(--dim);line-height:1.4}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:20px calc(118px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:28px}
.view{display:flex;flex-direction:column;gap:28px}

/* ---------- JRPG window ---------- */
.win{position:relative;min-width:0;background:linear-gradient(180deg,var(--win-top) 0%,var(--win-bot) 100%);border:2px solid var(--frame);border-radius:8px;box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--win-edge),0 12px 18px -10px var(--shadow);padding:22px 14px 14px}
.wt{position:absolute;top:-13px;left:12px;display:inline-flex;align-items:center;gap:6px;background:var(--ink);border:2px solid var(--frame);border-radius:4px;padding:3px 8px 3px;font-family:var(--font-display);font-size:20px;line-height:16px;letter-spacing:.07em;text-transform:uppercase;color:var(--amber);white-space:nowrap}
.wt .ic{width:12px;height:auto}
.wt-r{position:absolute;top:-13px;right:12px}

/* ---------- controls ---------- */
.btn{--c:var(--orange);--cd:var(--orange-deep);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-family:var(--font-display);font-size:24px;line-height:1;letter-spacing:.05em;text-transform:uppercase;color:var(--on-accent);background:var(--c);padding:10px 16px 12px;min-height:46px;clip-path:var(--notch);box-shadow:inset 0 -4px 0 var(--cd),inset 0 3px 0 var(--btn-hi);touch-action:manipulation;-webkit-user-select:none;user-select:none;text-decoration:none}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 var(--cd),inset 0 3px 0 var(--btn-hi)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--text),inset 0 -4px 0 var(--cd)}
.btn[disabled]{filter:grayscale(1) brightness(.65);cursor:not-allowed;transform:none}
.btn.amber{--c:var(--amber);--cd:var(--amber-deep)}
.btn.red{--c:var(--bad);--cd:var(--bad-deep);color:var(--text)}
.btn.ghost{--c:var(--ghost);--cd:var(--win-edge);color:var(--text)}
.btn.sm{font-size:20px;min-height:36px;padding:6px 12px 8px}
.btn.xl{font-size:34px;min-height:64px}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 auto}
.row.end{justify-content:flex-end}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;padding:8px 4px}
.link:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--chip);color:var(--text);border-radius:4px;padding:6px 10px;font-size:14px;line-height:1.15;cursor:pointer;min-height:36px;text-align:left}
.chip small{display:block;color:var(--muted);font-size:11px}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber);background:var(--chip-on)}
.chip[aria-pressed="true"] small{color:var(--amber)}
.chip[disabled]{opacity:.5;cursor:not-allowed}
.chip .ic{width:10px;height:auto}
.chip:focus-visible,.sw:focus-visible,.quest:focus-visible,.cmd:focus-visible,.fitem:focus-visible,.medal:focus-visible,.say:focus-visible,.hbtn:focus-visible,.tab:focus-visible,.navbtn:focus-visible,.x:focus-visible,.wrow:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.sw{width:36px;height:36px;border:2px solid var(--line);border-radius:4px;background:var(--sw);cursor:pointer;box-shadow:inset 0 -5px 0 var(--shade)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--amber),inset 0 -5px 0 var(--shade)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.inp{width:100%;font-family:var(--font-ui);font-size:16px;color:var(--text);background:var(--field);border:2px solid var(--line);border-radius:4px;padding:10px 12px;min-height:46px}
.inp:focus{outline:none;border-color:var(--amber)}
.inp::placeholder{color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:16px}
.err{color:var(--bad);font-size:14px}
.err:empty{display:none}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stepper .inp{text-align:center;font-family:var(--font-display);font-size:30px;padding:4px 8px}
.navbtn{min-height:44px;min-width:44px;border:2px solid var(--frame);background:var(--ghost);border-radius:4px;cursor:pointer;color:var(--text);font-size:16px;display:grid;place-items:center}
.navbtn[disabled]{opacity:.3;cursor:default}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--amber)}

.meter{height:16px;border:2px solid var(--frame);border-radius:3px;background:var(--ink);padding:2px}
.meter i{display:block;height:100%;max-width:100%;background:repeating-linear-gradient(90deg,var(--mc,var(--good)) 0 7px,transparent 7px 9px);transition:width .4s steps(6)}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin:10px 0 5px;color:var(--muted)}
.mrow b{font-weight:400;color:var(--text);font-variant-numeric:tabular-nums}

/* ---------- scene ---------- */
.scene-win{padding:8px 8px 10px}
.scene{position:relative;overflow:hidden;border-radius:4px;background:var(--ink);box-shadow:inset 0 0 0 2px var(--win-edge);cursor:pointer;min-height:180px}
.scene canvas,.stage canvas{position:absolute;top:0;left:50%;transform:translateX(-50%);display:block}
.px{image-rendering:crisp-edges;image-rendering:pixelated}
.b1{filter:blur(.45px)}
.b2{filter:blur(1.25px) saturate(.9)}
.b3{filter:blur(2.4px)}
.grade{position:absolute;inset:0;pointer-events:none}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:2}
.hud>*{pointer-events:auto}
.lvtag{display:flex;align-items:center;gap:8px;background:var(--hud-bg);border:2px solid var(--frame);border-radius:6px;padding:4px 10px 4px 4px;min-width:0}
.lvnum{font-family:var(--font-display);background:var(--amber);color:var(--on-accent);border-radius:3px;padding:3px 6px 2px;font-size:20px;line-height:18px;white-space:nowrap}
.lvname{min-width:0}
.lvname b{display:block;font-family:var(--font-display);font-weight:400;font-size:21px;line-height:17px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvname small{display:block;font-size:11px;color:var(--amber);line-height:14px;white-space:nowrap}
.hud-r{display:flex;gap:6px;flex:none}
.hbtn{display:inline-flex;align-items:center;gap:5px;height:36px;min-width:36px;justify-content:center;background:var(--hud-bg);border:2px solid var(--frame);border-radius:6px;padding:0 8px;cursor:pointer;font-family:var(--font-display);font-size:21px;line-height:1;color:var(--text)}
.hbtn .ic{width:14px;height:auto}
.hbtn.streak{color:var(--amber)}
.say{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--ink-2);border:2px solid var(--frame);border-radius:6px;padding:10px 12px;margin-top:10px;cursor:pointer;font-size:15px;line-height:1.4;min-height:50px}
.say .cur{color:var(--amber);flex:none;margin-top:1px}
.say.go .cur{animation:blink 1s steps(1) infinite}
.xprow{display:flex;align-items:center;gap:10px;margin-top:10px;font-family:var(--font-display);font-size:18px;letter-spacing:.05em;color:var(--muted)}
.xprow b{font-weight:400;color:var(--amber)}
.xpbar{flex:1;height:16px;border:2px solid var(--frame);background:var(--ink);border-radius:3px;padding:2px;min-width:0}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--amber) 0 7px,var(--amber-deep) 7px 9px);transition:width .5s steps(8)}
.xpnum{font-variant-numeric:tabular-nums;white-space:nowrap}

.mini-hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:linear-gradient(180deg,var(--win-top),var(--win-bot));border:2px solid var(--frame);border-radius:8px;box-shadow:0 0 0 2px var(--ink);padding:8px 10px;margin-top:-6px}
.mini-hud .xpbar{height:14px}

/* ---------- home ---------- */
.today{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:100%;height:100%;display:block}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-c b{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:.85}
.ring-c small{font-size:11px;color:var(--muted)}
.bigline{font-family:var(--font-display);font-size:44px;line-height:.85}
.bigline small{font-family:var(--font-ui);font-size:14px;color:var(--muted);margin-left:6px;letter-spacing:0}
.bigline.over{color:var(--bad)}
.today-cta{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today-cta>.btn{padding-inline:8px}

.quest{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer}
.quest:first-child{border-top:0;padding-top:2px}
.cb{width:28px;height:28px;border:2px solid var(--frame);border-radius:3px;background:var(--ink);display:grid;place-items:center;color:var(--on-accent)}
.cb .ic{width:15px;height:auto;visibility:hidden}
.quest[aria-pressed="true"] .cb{background:var(--good);border-color:var(--good)}
.quest[aria-pressed="true"] .cb .ic{visibility:visible}
.qt{min-width:0}
.qt b{display:block;font-weight:400;font-size:16px}
.qt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.quest[aria-pressed="true"] .qt b{color:var(--good)}
.qx{font-family:var(--font-display);font-size:21px;color:var(--amber);white-space:nowrap}
.quest[aria-pressed="true"] .qx{color:var(--dim)}
.auto{display:inline-block;font-size:10px;line-height:1;border:1px solid var(--good);color:var(--good);border-radius:3px;padding:2px 4px;margin-left:6px;vertical-align:2px;letter-spacing:.05em}
.bonus{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.bonus b{font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--amber)}
.bonus.done b{color:var(--good)}

.wrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;cursor:pointer;color:var(--text)}
.wrow:first-child{border-top:0;padding-top:2px}
.wrow small{display:block;color:var(--muted);font-size:13px}
.wrow b{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1}
.pips{display:flex;gap:4px}
.pip{width:14px;height:14px;border:2px solid var(--frame);background:var(--ink)}
.pip.on{background:var(--amber);border-color:var(--amber)}
.flame{color:var(--amber);display:inline-flex;align-items:center;gap:6px}
.flame .ic{width:14px;height:auto}

.rules{display:flex;flex-direction:column;gap:12px}
.rules li{display:grid;grid-template-columns:14px 1fr;gap:10px}
.rules li::before{content:"";width:8px;height:8px;background:var(--amber);margin-top:6px;transform:rotate(45deg)}
.rules small{display:block;color:var(--muted);font-size:13px}
.motto{margin-top:14px;font-family:var(--font-display);font-size:24px;line-height:1;color:var(--amber);letter-spacing:.03em}

/* ---------- chow ---------- */
.datebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-bottom:14px}
.datebar b{text-align:center;font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1;letter-spacing:.03em}
.zone{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 8px;border:2px solid currentColor;border-radius:4px;letter-spacing:.04em;text-transform:uppercase}
.zone.good{color:var(--good)}
.zone.bad{color:var(--bad)}
.zone.neutral{color:var(--muted)}
.meals{display:flex;flex-direction:column;gap:18px}
.meal h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:23px;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:6px}
.meal h3 small{font-family:var(--font-ui);font-size:13px;color:var(--muted);letter-spacing:0}
.food{display:grid;grid-template-columns:1fr auto auto 34px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.food:last-child{border-bottom:0}
.fn{min-width:0}
.fn b{display:block;font-weight:400;font-size:15px;overflow-wrap:anywhere}
.fn small{color:var(--muted);font-size:12px}
.fk,.fp{text-align:right;font-family:var(--font-display);font-size:21px;line-height:1;font-variant-numeric:tabular-nums}
.fk small,.fp small{display:block;font-family:var(--font-ui);font-size:10px;color:var(--muted)}
.x{width:34px;height:34px;border:2px solid var(--line);background:none;border-radius:4px;color:var(--muted);cursor:pointer;font-size:14px;display:grid;place-items:center}
.x .ic,.navbtn .ic{width:12px;height:auto}
.empty{color:var(--muted);font-size:15px;padding:4px 0}
.pchip{display:inline-block;font-size:10px;line-height:1;color:var(--good);border:1px solid var(--good);border-radius:3px;padding:2px 4px;margin-left:6px;vertical-align:2px}
.flist{display:flex;flex-direction:column;margin-top:10px;max-height:46vh;overflow-y:auto;border-top:1px solid var(--line)}
.flist li{border-bottom:1px solid var(--line)}
.fitem{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 2px;cursor:pointer}
.fitem[aria-expanded="true"]{color:var(--amber)}
.qty{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 2px 12px}
.qty .btn{margin-left:auto}
.custom{margin-top:14px;border:2px solid var(--line);border-radius:6px;padding:10px 12px}
.custom summary{cursor:pointer;color:var(--amber);font-size:15px}
.custom[open] summary{margin-bottom:12px}

.chart{position:relative;margin-top:4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font-ui);fill:var(--muted);font-size:11px}
.chart .hit{fill:transparent;cursor:pointer;outline:none}
.chart .hit:focus-visible{stroke:var(--amber);stroke-width:2}
.tt{position:absolute;pointer-events:none;background:var(--ink);border:2px solid var(--frame);border-radius:4px;padding:6px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-112%);z-index:3;color:var(--muted)}
.tt b{display:block;font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1;color:var(--text)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.legend .kl{width:16px;height:2px;background:var(--amber)}
.legend .kd{width:8px;height:8px;background:var(--amber)}
.legend .kg{width:16px;height:0;border-top:2px dashed var(--good)}
.legend .kz{width:14px;height:10px;background:var(--good);opacity:.25}
.tblwrap{overflow-x:auto;margin-top:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tbl td .x{margin-left:auto;width:30px;height:30px}

/* ---------- yard ---------- */
.wk-card h3{font-size:32px;color:var(--text)}
.wk-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.tag{font-family:var(--font-display);font-size:20px;color:var(--amber);white-space:nowrap}
.wk-card p{color:var(--muted);font-size:14px}
.suits{margin-top:10px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.suits span{white-space:nowrap}
.suit{font-size:16px}
.suit.r{color:var(--bad)}
.diffs{margin-top:12px}
.wk-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.wk-foot .muted{font-size:13px}
.locked-note{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-top:12px}
.locked-note .ic{width:12px;height:auto;color:var(--amber)}
.wk-card.locked h3{color:var(--muted)}
.hist{display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0;padding-top:0}
.hist small{display:block;color:var(--muted)}
.hist b{font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--amber)}

/* ---------- progress ---------- */
.wt-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wt-big b{font-family:var(--font-display);font-weight:400;font-size:60px;line-height:.8}
.wt-big span{font-size:14px;color:var(--muted)}
.delta{font-size:14px}
.delta.good{color:var(--good)}
.delta.bad{color:var(--bad)}
.goalrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin:14px 0 6px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--ink-2);border:2px solid var(--line);border-radius:4px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:32px;line-height:.95}
.stat small{color:var(--muted);font-size:12px}
.gear li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px;color:var(--dim)}
.gear li:first-child{border-top:0;padding-top:0}
.gear .lv{font-family:var(--font-display);font-size:19px}
.gear li.on{color:var(--text)}
.gear li.on .lv{color:var(--amber)}
.gear .ic{width:12px;height:auto}
.gear li.on .ic{color:var(--good)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.medal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:none;border:0;cursor:pointer;padding:2px 0;min-width:0}
.medal i{width:52px;height:52px;display:grid;place-items:center;font-style:normal;font-family:var(--font-display);font-size:20px;line-height:1;color:var(--on-accent);background:radial-gradient(circle at 35% 30%,var(--amber-hi),var(--amber) 45%,var(--amber-deep));clip-path:var(--octa)}
.medal small{font-size:11px;line-height:1.25;color:var(--text)}
.medal.off i{background:var(--ghost);color:var(--dim)}
.medal.off small{color:var(--dim)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.setrow:first-child{border-top:0;padding-top:0}
.setrow small{display:block;color:var(--muted);font-size:12px}
.plan{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;color:var(--muted)}
.plan b{font-weight:400;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.plan .tot{border-top:1px solid var(--line);padding-top:8px;color:var(--text)}
.plan .tot b{color:var(--amber);font-family:var(--font-display);font-size:24px;line-height:1}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:14px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--ink) 42%)}
.tabs-in{position:relative;max-width:456px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 86px 1fr 1fr;align-items:center;background:linear-gradient(180deg,var(--win-top),var(--win-bot));border:2px solid var(--frame);border-radius:10px;box-shadow:0 0 0 2px var(--ink);height:64px;padding:0 4px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;color:var(--muted);font-family:var(--font-display);font-size:17px;line-height:1;letter-spacing:.07em;cursor:pointer;text-transform:uppercase;border-radius:6px}
.tab .ic{width:22px;height:auto}
.tab[aria-current="page"]{color:var(--amber)}
.sos-wrap{justify-self:center;align-self:start;margin-top:-26px;width:80px;height:80px;padding:3px;background:var(--frame);clip-path:var(--octa);position:relative}
.sosbtn{width:100%;height:100%;border:0;cursor:pointer;background:var(--bad);color:var(--text);clip-path:var(--octa);box-shadow:inset 0 -7px 0 var(--bad-deep),inset 0 4px 0 var(--btn-hi);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--font-display);font-size:28px;line-height:.85;letter-spacing:.06em}
.sosbtn small{font-family:var(--font-ui);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.sosbtn:active{box-shadow:inset 0 -2px 0 var(--bad-deep)}
.sosbtn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--text),inset 0 -7px 0 var(--bad-deep)}
.sos-dot{position:absolute;top:10px;right:14px;width:10px;height:10px;background:var(--amber);border:2px solid var(--ink);animation:blink .8s steps(1) infinite}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:480px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;border-radius:12px 12px 0 0;border-bottom:0;padding:24px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s steps(5)}
.sheet h2{font-size:36px;padding-right:48px;margin-bottom:4px}
.sheet .x-close{position:absolute;top:12px;right:12px}
.sheet .stack{margin-top:14px}
.full{position:fixed;inset:0;z-index:70;background:var(--ink);overflow-y:auto;overscroll-behavior:contain;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.full-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:95;background:var(--ink);border:2px solid var(--amber);border-radius:6px;box-shadow:0 0 0 2px var(--ink);padding:10px 14px;font-size:14px;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.pop{animation:up .2s steps(4)}
.xpf{position:fixed;z-index:96;pointer-events:none;font-family:var(--font-display);font-size:28px;line-height:1;color:var(--amber);text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink);transform:translate(-50%,0);animation:xpf .95s steps(10) forwards;white-space:nowrap}
@keyframes xpf{to{transform:translate(-50%,-60px);opacity:0}}
@keyframes up{from{transform:translateY(22px);opacity:.3}to{transform:none;opacity:1}}
@keyframes blink{50%{opacity:0}}

/* ---------- title + onboarding ---------- */
.logo{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.logo h1{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;font-size:clamp(52px,17vw,72px);line-height:.78;letter-spacing:.04em;color:var(--amber);text-shadow:0 4px 0 var(--amber-deep),4px 6px 0 var(--ink)}
.logo h1 .ic{width:34px;height:auto;color:var(--amber);filter:drop-shadow(0 4px 0 var(--amber-deep))}
.logo p{color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-size:12px}
.pitch{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.stage{position:relative;width:100%;overflow:hidden;background:var(--ink);border:2px solid var(--frame);border-radius:6px;box-shadow:0 0 0 2px var(--ink)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.steps{display:flex;gap:6px;justify-content:center}
.obtop{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.obtop .mbtn{justify-self:end}
.mbtn span{font-family:var(--font-ui);font-size:13px;letter-spacing:0}
.hnote{font-size:12px;color:var(--muted);line-height:1.3}
.hnote.bad{color:var(--bad)}
.inp[aria-invalid="true"]{border-color:var(--bad)}
.steps i{width:24px;height:6px;background:var(--line)}
.steps i.on{background:var(--amber)}
.obh{display:flex;flex-direction:column;gap:4px}
.obh h2{font-size:40px}
.obh p{color:var(--muted);font-size:14px}
.plan-num{font-family:var(--font-display);font-size:68px;line-height:.8;color:var(--amber)}
.plan-num small{font-size:26px;color:var(--text);margin-left:6px}

/* ---------- workout player ---------- */
.wkp-head{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center}
.wkp-head h2{font-size:32px}
.wkp-head small{display:block;color:var(--muted);font-size:12px}
.clock{font-family:var(--font-display);font-size:32px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.pbar{height:14px;border:2px solid var(--frame);border-radius:3px;padding:2px;background:var(--ink)}
.pbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--orange) 0 7px,var(--orange-deep) 7px 9px);transition:width .3s steps(4)}
.wkp-main{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:250px;justify-content:center}
.bigc{font-family:var(--font-display);font-size:128px;line-height:.75;font-variant-numeric:tabular-nums}
.bigc.hot{color:var(--amber)}
.bigc small{font-size:44px;color:var(--muted)}
.reps{font-family:var(--font-display);font-size:44px;line-height:.9}
.reps b{color:var(--amber);font-weight:400}
.phase{font-family:var(--font-display);font-size:24px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.phase.work{color:var(--good)}
.phase.rest{color:var(--steel)}
.tip{font-size:14px;color:var(--muted);max-width:34ch}
.tip b{color:var(--text);font-weight:400}
.todo{display:flex;flex-direction:column;gap:6px;font-family:var(--font-display);font-size:32px;line-height:1}
.todo b{color:var(--amber);font-weight:400}
.wkp-act{display:flex;flex-direction:column;gap:10px}
.wkp-act .row .btn{flex:1}
.card{position:relative;width:150px;height:210px;margin:0 auto;background:var(--card);color:var(--card-ink);border:3px solid var(--ink);border-radius:10px;box-shadow:0 0 0 3px var(--frame),0 14px 0 -4px var(--shadow)}
.card.red{color:var(--card-red)}
.card .ctl,.card .cbr{position:absolute;font-family:var(--font-display);font-size:30px;line-height:.85;text-align:center}
.card .ctl{top:10px;left:10px}
.card .cbr{bottom:10px;right:10px;transform:rotate(180deg)}
.card .cs{position:absolute;inset:0;display:grid;place-items:center;font-size:88px;line-height:1}
.card .cs.jk{font-family:var(--font-display);font-size:40px;letter-spacing:.06em}
.card.back{background:repeating-linear-gradient(45deg,var(--orange) 0 8px,var(--orange-deep) 8px 16px);color:var(--text)}
.card.back .cs{font-family:var(--font-display);font-size:34px;text-shadow:2px 2px 0 var(--ink)}
.card.flip{animation:flip .32s steps(6)}
@keyframes flip{from{transform:perspective(600px) rotateY(90deg)}to{transform:perspective(600px) rotateY(0)}}
.rungs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:320px}
.rungs i{width:14px;height:14px;border:2px solid var(--frame);background:var(--ink)}
.rungs i.on{background:var(--amber);border-color:var(--amber)}
.done-list{display:flex;flex-direction:column;gap:6px;width:100%;max-width:300px}
.done-list li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:15px}
.done-list b{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1}
.xp-big{font-family:var(--font-display);font-size:72px;line-height:.8;color:var(--amber);text-shadow:0 4px 0 var(--amber-deep)}
.confirm{border:2px solid var(--bad);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:center}

/* ---------- battle ---------- */
.bt-top{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
.bt-top h2{font-size:34px;color:var(--bad)}
.bt-top small{display:block;color:var(--muted);font-size:12px}
.hp{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--font-display);font-size:22px;line-height:1}
.hpbar{height:20px;border:2px solid var(--frame);border-radius:3px;background:var(--ink);padding:2px}
.hpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--bad) 0 7px,var(--bad-deep) 7px 9px);transition:width .3s steps(6)}
.dmgf{position:absolute;z-index:3;pointer-events:none;font-family:var(--font-display);font-size:34px;line-height:1;color:var(--text);text-shadow:2px 0 var(--bad-deep),-2px 0 var(--bad-deep),0 2px var(--bad-deep),0 -2px var(--bad-deep);transform:translate(-50%,0);animation:xpf .8s steps(8) forwards}
.bt-msg{font-size:15px;line-height:1.45;min-height:3em}
.cmd{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer;font-size:16px;color:var(--text)}
.cmd:first-child{border-top:0;padding-top:2px}
.cmd .cur{visibility:hidden;color:var(--amber)}
.cmd:hover .cur,.cmd:focus-visible .cur{visibility:visible}
.cmd .dmg{font-family:var(--font-display);font-size:21px;color:var(--bad)}
.cmd[disabled]{color:var(--dim);cursor:default}
.cmd[disabled] .dmg{color:var(--dim)}
.snacks{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 12px 24px}
.wave{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.wave b{font-family:var(--font-display);font-weight:400;font-size:44px;line-height:.8;color:var(--steel);font-variant-numeric:tabular-nums}
.wave p{font-size:13px;color:var(--muted)}
.victory{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.victory h2{font-size:52px;color:var(--amber);text-shadow:0 4px 0 var(--amber-deep)}
.smart li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.smart li:first-child{border-top:0;padding-top:0}
.smart small{color:var(--good);font-size:12px;text-align:right;flex:none;max-width:45%}

/* ---------- level up ---------- */
.lvl{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:16px}
.lvl-in{width:100%;max-width:400px;text-align:center;overflow:hidden;display:flex;flex-direction:column;gap:12px;align-items:center;padding:26px 16px 18px}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,var(--ray) 0 9deg,transparent 9deg 18deg);animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(1turn)}}
.lvl-in>*:not(.rays){position:relative}
.lvl-in h2{font-size:70px;line-height:.8;color:var(--amber);text-shadow:0 4px 0 var(--amber-deep),4px 6px 0 var(--ink)}
.lvl-in .stage{max-width:260px}
.lvl-lv{font-family:var(--font-display);font-size:34px;line-height:1}
.lvl-lv b{color:var(--amber);font-weight:400;font-size:52px}
.lvl-in p{font-size:15px;color:var(--muted)}
.lvl-in p b{color:var(--text);font-weight:400}

@media (max-width:360px){
  .today{grid-template-columns:96px 1fr}
  .ring{width:96px;height:96px}
  .badges{grid-template-columns:repeat(3,1fr)}
  .logo h1{font-size:60px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ===== v3: segments, missions + chest, boss, playbook, fasting, locker, loot, fx ===== */
:root{
  --r-c:#a7b1da; --r-r:#4fa3ff; --r-e:#c46bff; --r-l:#ffc54a;
  --fast:#7d93c7; --dmg:#ff6a8a;
}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--ink);border:2px solid var(--frame);border-radius:8px;padding:4px;box-shadow:0 0 0 2px var(--ink)}
.seg button{border:0;border-radius:5px;background:none;color:var(--muted);font-family:var(--font-display);font-size:clamp(15px,4.6vw,20px);line-height:1;letter-spacing:.04em;text-transform:uppercase;padding:9px 2px 10px;cursor:pointer;min-height:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--on-accent);box-shadow:inset 0 -3px 0 var(--amber-deep)}
.seg button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.view>.seg,#eat-seg,#me-seg{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:15}
.btag{display:inline-block;font-family:var(--font-ui);font-size:10px;line-height:1;letter-spacing:.06em;text-transform:uppercase;color:var(--on-accent);background:var(--amber);border-radius:3px;padding:3px 5px 2px;margin-right:6px;vertical-align:2px}
.qx .ic{width:6px;height:auto;margin-left:6px;vertical-align:1px;color:var(--muted)}
.mlist .quest:first-child{border-top:0}
.cb.pop{animation:pop .45s steps(5)}
@keyframes pop{0%{transform:scale(1.7) rotate(-12deg)}60%{transform:scale(.9)}100%{transform:none}}

/* daily chest bar */
.chestbar{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--ink);border:2px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px;color:var(--text)}
.chestbar b{display:block;font-weight:400;font-size:15px;line-height:1.3}
.chestbar small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.cicon{width:40px;height:40px;display:grid;place-items:center;background:var(--ghost);border-radius:6px;color:var(--amber-deep)}
.cicon .ic{width:24px;height:auto;--ic2:var(--amber)}
.cpips{display:flex;gap:4px}
.cpips i{width:12px;height:12px;border:2px solid var(--frame);background:var(--ink)}
.cpips i.on{background:var(--amber);border-color:var(--amber)}
.chestbar.ready{cursor:pointer;border-color:var(--amber);background:linear-gradient(90deg,rgba(255,197,74,.18),rgba(255,197,74,.04));animation:glowb 1.4s ease-in-out infinite}
.chestbar.ready .cicon{background:var(--amber);color:var(--on-accent);animation:bounce .9s steps(3) infinite}
.chestbar.ready .cicon .ic{--ic2:#fff}
.chestbar.opened .cicon{color:var(--dim)}
.open-tag{font-family:var(--font-display);font-size:24px;line-height:1;color:var(--on-accent);background:var(--amber);padding:6px 10px 7px;clip-path:var(--notch)}
.rar{font-family:var(--font-display);font-size:18px;letter-spacing:.04em}
@keyframes glowb{50%{box-shadow:0 0 18px rgba(255,197,74,.45)}}
@keyframes bounce{50%{transform:translateY(-3px)}}

/* fuel fast line */
.fastline{display:grid;grid-template-columns:20px 1fr 8px;gap:10px;align-items:center;width:100%;margin-top:14px;padding:9px 12px;background:var(--ink);border:2px solid var(--line);border-radius:6px;color:var(--text);font-size:14px;text-align:left;cursor:pointer}
.fl-ic .ic{width:16px;height:auto;color:var(--fast)}
.fastline>.ic{width:6px;height:auto;color:var(--muted)}

/* weekly boss */
.boss-top{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
#boss-stage{border-radius:6px}
.boss-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.boss-name{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:.95;letter-spacing:.02em}
.shieldct{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.shico{position:relative;display:inline-grid;place-items:center;width:30px;height:32px;color:var(--steel)}
.shico .ic{position:absolute;inset:0;width:30px;height:32px}
.shico b{position:relative;font-family:var(--font-display);font-weight:400;font-size:18px;line-height:1;color:var(--ink);margin-top:-4px}
.shieldct.zero .shico,.shico.zero{color:var(--amber)}
.shieldct.zero span:last-child{color:var(--amber);font-family:var(--font-display);font-size:18px;letter-spacing:.04em}
.boss-m{height:14px}
.boss-m i{--mc:var(--r-e)}
.boss-info small{color:var(--muted);font-size:12px}
.boss-hits{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:12px;font-size:12px;color:var(--muted)}
.boss-hits li{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding-top:5px}
.boss-hits b{font-weight:400;color:var(--text);white-space:nowrap}
.break-btn{margin-top:12px;animation:glowb 1.2s ease-in-out infinite}

/* playbook card + overlay */
.pb-lead{font-size:14px;color:var(--muted);line-height:1.5}
.pb-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.pb-list li{position:relative;padding-left:18px;font-size:15px;line-height:1.5}
.pb-list li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;background:var(--amber);transform:rotate(45deg)}
.pb-list b{font-weight:400;color:var(--amber)}
.pb-note{margin-top:14px;font-family:var(--font-display);font-size:22px;line-height:1.05;color:var(--amber)}
.pb-warn{margin-top:14px;font-size:13px;line-height:1.5;color:var(--text);border:2px solid var(--bad);border-radius:6px;padding:10px 12px;background:rgba(255,74,92,.08)}
.pb-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pb-ttl{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.pb-ttl .ic{width:16px;height:auto}
.pb-ct{font-family:var(--font-display);font-size:22px;color:var(--muted)}
.pb-chs{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0}
.pb-ch{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:linear-gradient(180deg,var(--win-top),var(--win-bot));border:2px solid var(--frame);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--text)}
.pb-n{display:grid;place-items:center;width:36px;height:36px;font-family:var(--font-display);font-size:24px;background:var(--ink);border:2px solid var(--line);border-radius:4px;color:var(--amber)}
.pb-t b{display:block;font-weight:400;font-size:16px}
.pb-t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pb-x{font-family:var(--font-display);font-size:20px;color:var(--amber)}
.pb-x .ic{width:14px;height:auto;color:var(--good)}
.pb-ch.read .pb-n{color:var(--good);border-color:var(--good)}
.pb-ch:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.pb-chap{display:flex;flex-direction:column;gap:12px}
.pb-k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pb-k b{font-weight:400;color:var(--amber)}
.pb-chap h2{font-size:46px}
.pb-tag{color:var(--amber);font-size:15px}
.pb-body{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.pb-plan{background:var(--ink-2);border:2px solid var(--line);border-radius:6px;padding:12px}
.pb-week{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:6px;overflow:hidden}
.pb-week div{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.pb-week div:first-child{border-top:0}
.pb-week b{font-family:var(--font-display);font-weight:400;font-size:20px;line-height:1;color:var(--muted)}
.pb-week .on{background:rgba(255,197,74,.12)}
.pb-week .on b{color:var(--amber)}
.pb-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plate{display:block;width:120px;height:120px;margin:4px auto 6px}
.plate .pl{font-family:var(--font-display);font-size:13px;fill:var(--on-accent);letter-spacing:.04em}

/* fasting */
.fastwrap{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring.big{width:132px;height:132px}
.ring.big .ring-c b{font-size:30px}
.faststat{display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);min-width:0}
.fwin{font-size:15px}
.fwin b{font-weight:400;color:var(--amber)}
.fhist{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px}
.fhist div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.fhist i{display:block;width:16px;min-height:2px;background:var(--steel);border-radius:3px 3px 0 0}
.fhist .hit i{background:var(--good)}
.fhist b{font-weight:400;font-size:11px;color:var(--text)}
.fhist small{font-size:10px;color:var(--muted)}

/* easy meals */
.platewrap{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.platewrap .plate{margin:0}
.msets li.mset{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.msets li.mset:first-child{border-top:0;padding-top:2px}
.mset .fn small{line-height:1.3}
.flist.static{max-height:none;margin-bottom:10px}
.flist.static .fitem{cursor:default}

/* train */
.feat .wk-top h3{font-size:34px}
.wk-blurb{color:var(--muted);font-size:14px;line-height:1.5}
.movechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.movechips span{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:4px 7px;color:var(--text)}
.wklist{display:flex;flex-direction:column}
.wkrow{display:grid;grid-template-columns:1fr auto 8px;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer;color:var(--text)}
.wkrow:first-child{border-top:0;padding-top:2px}
.wkrow b{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1}
.wkrow small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.wkrow .tag .ic{width:12px;height:auto;color:var(--muted)}
.wkrow>.ic{width:6px;height:auto;color:var(--muted)}
.wkrow:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.exlist{display:flex;flex-direction:column;gap:10px}
.exlist li{display:flex;flex-direction:column;gap:3px;border-left:3px solid var(--amber);padding:2px 0 2px 10px;font-size:14px}
.exlist b{font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1}
.exlist small{color:var(--muted);font-size:12px}
.reps.big{font-size:44px}

/* locker */
#lock-stage{margin-bottom:12px}
.lock-ct{font-size:13px;color:var(--muted);margin-bottom:10px}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--ink);border:2px solid var(--line);border-radius:6px;padding:8px 4px;cursor:pointer;color:var(--text);min-width:0}
.item b{font-weight:400;font-size:12px;line-height:1.2}
.item small{font-size:10px;color:var(--rc)}
.ith{display:grid;place-items:center;width:100%;height:64px;border-radius:4px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--rc) 30%,transparent),transparent 70%)}
.ith img{max-width:100%;height:auto;max-height:60px;object-fit:contain}
.ith.aura{background:radial-gradient(circle at 50% 55%,var(--ac,#ff6fae),transparent 65%)}
.item.locked img{filter:brightness(0) opacity(.55)}
.item.locked b{color:var(--muted)}
.item.on{border-color:var(--rc);box-shadow:0 0 0 2px var(--ink),0 0 12px color-mix(in srgb,var(--rc) 60%,transparent)}
.item.r-l:not(.locked){animation:glowl 2s ease-in-out infinite}
.item:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@keyframes glowl{50%{box-shadow:0 0 14px rgba(255,197,74,.55)}}

/* chest overlay */
.chest-ov{position:fixed;inset:0;z-index:88;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(34,42,100,.98),rgba(4,5,14,.99) 70%);padding:16px}
.chest-in{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#ch-stage{width:100%;cursor:pointer;border-radius:8px}
#ch-stage:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.chest-text{min-height:92px;display:flex;flex-direction:column;gap:6px;align-items:center}
.chest-text h2{font-size:42px}
.ch-hint{font-family:var(--font-display);font-size:26px;letter-spacing:.06em;color:var(--amber);animation:blink 1s steps(1) infinite}
.ch-rar{font-family:var(--font-display);font-size:24px;letter-spacing:.12em;text-transform:uppercase}
.chest-act{display:flex;gap:10px;width:100%}
.chest-act .btn{flex:1}

/* stage overlays + fx */
.stage{position:relative}
.st-tint,.st-flash{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:overlay}
.st-flash{mix-blend-mode:normal}
.fx-layer{position:fixed;inset:0;z-index:97;pointer-events:none}
.stamp{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;font-family:var(--font-display);font-size:min(52px,12vw);line-height:.9;font-style:italic;letter-spacing:.04em;white-space:nowrap;color:var(--sc,#fff);text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),4px 5px 0 rgba(0,0,0,.5);animation:stamp 1.4s steps(14) forwards}
.stamp.late{top:66%;font-size:min(38px,9vw)}
.stamp.brk{font-size:min(68px,16vw)}
.stamp.rar{top:22%;font-size:min(44px,11vw)}
@keyframes stamp{0%{transform:translate(-50%,-50%) scale(2.4) rotate(-8deg);opacity:0}12%{transform:translate(-50%,-50%) scale(.92) rotate(-4deg);opacity:1}20%{transform:translate(-50%,-50%) scale(1.05) rotate(-4deg)}78%{opacity:1}100%{transform:translate(-50%,-62%) scale(1) rotate(-4deg);opacity:0}}
.sbanner{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4;pointer-events:none;background:rgba(7,10,32,.86);border:1px solid var(--muted);border-radius:4px;padding:4px 14px;font-size:14px;letter-spacing:.06em;color:var(--text);white-space:nowrap;animation:banner 1.2s ease-out forwards}
.sbanner.static{position:static;transform:none;animation:none;font-family:var(--font-display);font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border-color:var(--amber)}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-8px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.orb{position:fixed;left:0;top:0;z-index:96;width:10px;height:10px;margin:-5px 0 0 -5px;pointer-events:none;background:radial-gradient(circle,#fff 0 25%,var(--amber) 45%,rgba(255,197,74,0) 72%)}
.xpbar.pulse{animation:xpp .4s steps(4)}
@keyframes xpp{0%{box-shadow:0 0 0 0 rgba(255,197,74,.9)}100%{box-shadow:0 0 0 8px rgba(255,197,74,0)}}
.dmgf{font-size:46px;font-style:italic;color:#fff;text-shadow:2px 0 var(--dc,var(--dmg)),-2px 0 var(--dc,var(--dmg)),0 2px var(--dc,var(--dmg)),0 -2px var(--dc,var(--dmg)),3px 4px 0 var(--ink);animation:dmg 1.05s steps(10) forwards}
@keyframes dmg{0%{transform:translate(-50%,10px) scale(.4);opacity:0}15%{transform:translate(-50%,-6px) scale(1.25);opacity:1}30%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}

/* battle skills */
.cmdwin .cmd{grid-template-columns:22px 1fr auto}
.cmd .cur{visibility:hidden;color:var(--ink)}
.cmd .cur .ic{width:20px;height:auto;--ic2:#fff}
.cmd .sk{display:block;font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1;letter-spacing:.03em;color:var(--ec)}
.cmd .dmg{font-style:italic}
.hp{grid-template-columns:auto 1fr auto auto}
.bt-sh{color:var(--steel)}
.bt-sh.zero{color:var(--amber)}

/* hud shields + misc */
.shc{display:inline-flex;align-items:center;gap:3px;margin-left:6px;color:var(--steel)}
.shc .ic{width:11px;height:auto}
.mini-hud .flame{gap:4px}
.stat b{font-variant-numeric:normal}
#pb-win,#mission-win,#fuel-win,#boss-win{order:0}
@media (max-width:370px){
  .boss-top{grid-template-columns:110px 1fr}
  .fastwrap{grid-template-columns:110px 1fr}
  .ring.big{width:110px;height:110px}
  .items{grid-template-columns:repeat(2,1fr)}
  .seg button{font-size:17px}
}
@media (prefers-reduced-motion: reduce){
  .chestbar.ready,.chestbar.ready .cicon,.break-btn,.item.r-l:not(.locked){animation:none}
  .stamp{animation:none!important;transform:translate(-50%,-50%) rotate(-4deg)}
  .dmgf{animation:none!important;transform:translate(-50%,0)}
  .sbanner:not(.static){animation:none!important}
  .xpf{animation:none!important}
}
.chips:not(.scroll) .chip{flex:0 1 auto;max-width:100%}
.chips:not(.scroll) .chip small{white-space:normal}
.seg:has(> button:nth-child(4)) button{font-size:clamp(13px,4vw,19px);letter-spacing:.02em}

</style>

</div>

<nav class="tabs" id="tabs" hidden aria-label="Main">

<div class="overlay" id="ov-sheet" hidden><div class="sheet win" id="sheet" role="dialog" aria-modal="true"></div></div>

      const y0=h-30, y1=R.hero?h-HERO_H-6:Math.floor(h*.18), y=Math.round(y0+(y1-y0)*e);
      f.globalCompositeOperation='lighter'; glow(f,cx,y+shh/2,26,R.rgb,.28*k); if (R.aura) glow(f,cx,y+shh/2,22,R.aura,.55*k); f.globalCompositeOperation='source-over';
      g.globalAlpha=Math.min(1,k*2); g.drawImage(spr,cx-Math.round(sw/2),y); g.globalAlpha=1;
    }
    // food boss
    if (this.boss && !this.bossDead){
      const bx=Math.floor(w*.72), by=h-24+Math.round(RM?0:Math.sin(t/380)*1.5), sh=t<this.shakeUntil?(Math.floor(t/40)%2?1:-1):0;
      g.fillStyle='rgba(0,0,0,.4)'; g.fillRect(bx-12,h-5,25,1); g.fillRect(bx-9,h-4,19,1);
      g.drawImage(getBoss(this.boss.type,t<this.bossHit),bx-20+sh,by-19); this.bossPos={x:bx,y:by};
    }
    // fighter
    if (this.hero){
      const pose=this.pose(t), lunge=pose.arms==='punch'?4:0;
      g.fillStyle='rgba(0,0,0,.4)'; g.fillRect(hx-8,fy,17,1); g.fillRect(hx-6,fy+1,13,1);
      g.drawImage(getHero(this.hero,pose,battle?'#ff8a6a':'#ffd49a'),hx-16+lunge,fy-HERO_FOOT+(pose.jump||0));
      const ar=auraRGB(this.hero,t); if (ar){ f.globalCompositeOperation='lighter'; glow(f,hx,fy-20,22,ar,RM?.22:.18+.08*Math.sin(t/400)); f.globalCompositeOperation='source-over'; }
    }
    f.globalCompositeOperation='lighter';
    if (battle){
      glow(f,w*.72,h-20,26,'255,60,70',.12);
      if (!RM && Math.random()<dt*6) this.parts.add({x:Math.random()*w,y:h,vx:(Math.random()-.5)*4,vy:-8-Math.random()*10,g:-2,life:2+Math.random(),age:0,c:Math.random()<.5?'#ff7a1f':'#ffc54a',s:.6});
    } else if (this.kind==='studio' || this.kind==='buddy'){
      const gr=f.createLinearGradient(0,0,0,h); gr.addColorStop(0,'rgba(255,220,160,.20)'); gr.addColorStop(1,'rgba(255,220,160,0)');
      f.fillStyle=gr; f.beginPath(); f.moveTo(w/2-6,0); f.lineTo(w/2+6,0); f.lineTo(w/2+24,h); f.lineTo(w/2-24,h); f.closePath(); f.fill();
      glow(f,w/2,h-7,22,'120,150,255',.2);
      if (!RM && Math.random()<dt*3) this.parts.add({x:hx-14+Math.random()*28,y:fy-40+Math.random()*36,vx:0,vy:-4,g:0,life:.7,age:0,c:'#fff4c8',s:.6});
    }
    // timed effects
    this.fxl=this.fxl.filter(e=>now-e.t0<e.dur);
    for (const e of this.fxl){
      const k=(now-e.t0)/e.dur;
      if (e.type==='pillar'){
        const a=k<.15?k/.15:1-(k-.15)/.85, pw=3+12*Math.min(1,k*4);
        const gr=f.createLinearGradient(e.x-pw/2,0,e.x+pw/2,0);
        gr.addColorStop(0,`rgba(${e.rgb},0)`); gr.addColorStop(.3,`rgba(${e.rgb},${(a*.8).toFixed(3)})`); gr.addColorStop(.5,`rgba(255,255,255,${(a*.95).toFixed(3)})`); gr.addColorStop(.7,`rgba(${e.rgb},${(a*.8).toFixed(3)})`); gr.addColorStop(1,`rgba(${e.rgb},0)`);
        f.fillStyle=gr; f.fillRect(e.x-pw/2,0,pw,h-5); glow(f,e.x,h-8,18,e.rgb,a*.6);
      } else if (e.type==='ring'){
        f.strokeStyle=`rgba(${e.rgb},${(1-k).toFixed(3)})`; f.lineWidth=1.2; f.beginPath(); f.ellipse(e.x,e.y,4+34*k,(4+34*k)*.35,0,0,Math.PI*2); f.stroke();
      }
    }
    f.globalCompositeOperation='source-over';
    this.parts.step(dt); this.parts.draw(f);
  }
}

/* ============================ 8-BIT SOUND + MUSIC ============================ */
const SFX = (() => {
  let ac = null, master = null, comp = null;
  function ctx(){
    if (!ac){
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ac = new AC();
      comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
      comp.connect(ac.destination);
      master = ac.createGain(); master.gain.value = 0.14; master.connect(comp);
    }
    return ac;
  }
  function tone(f, t0, dur, type='square', vol=1, slide=0){
    const a = ctx(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), st = a.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, st);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f*slide), st+dur);
    g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(vol, st+0.01); g.gain.exponentialRampToValueAtTime(0.0001, st+dur);
    o.connect(g); g.connect(master); o.start(st); o.stop(st+dur+0.03);
  }
  function noise(t0, dur, vol=.6, hp=800){
    const a = ctx(); if (!a) return;
    const len = Math.max(1, Math.floor(a.sampleRate*dur)), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = b; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start(a.currentTime+t0);
  }
  const P = {
    blip(){ tone(880,0,.05,'square',.45); },
    coin(){ tone(1046,0,.06,'square',.55); tone(1568,.06,.16,'square',.55); },
    undo(){ tone(660,0,.06,'square',.35); tone(440,.06,.1,'square',.35); },
    err(){ tone(180,0,.09,'square',.4); tone(150,.1,.14,'square',.4); },
    level(){ [523,659,784,1046,1319,1568].forEach((f,i)=>tone(f,i*.07,.12,'square',.45)); tone(1046,.46,.55,'square',.4); tone(1319,.46,.55,'triangle',.35); tone(1568,.46,.55,'triangle',.3); },
    card(){ noise(0,.07,.35,2500); tone(1400,0,.03,'triangle',.2); },
    beep(){ tone(988,0,.09,'square',.45); },
    go(){ tone(1319,0,.22,'square',.5); },
    hit(){ noise(0,.12,.7,400); tone(220,0,.14,'square',.45,.4); },
    boss(){ tone(110,0,.38,'sawtooth',.45,.7); tone(116,0,.38,'square',.3,.7); },
    win(){ [392,523,659,784].forEach((f,i)=>tone(f,i*.09,.14,'square',.45)); tone(1046,.38,.6,'square',.4); tone(784,.38,.6,'triangle',.32); },
    ready(){ [784,988,1175,1568].forEach((f,i)=>tone(f,i*.06,.1,'triangle',.5)); },
    shake(){ noise(0,.09,.5,300); tone(140,0,.1,'square',.35,.6); },
    open(){ noise(0,.25,.6,900); [523,659,784,1046,1319].forEach((f,i)=>tone(f,.05+i*.05,.16,'square',.4)); },
    rare(){ [659,831,988,1319].forEach((f,i)=>tone(f,i*.08,.2,'triangle',.5)); },
    epic(){ [523,659,784,1046,1319,1568].forEach((f,i)=>tone(f,i*.07,.22,'square',.38)); tone(1046,.48,.7,'triangle',.4); },
    legendary(){ [392,523,659,784,1046,1319,1568,2093].forEach((f,i)=>tone(f,i*.07,.25,'square',.36)); tone(1568,.62,1.1,'triangle',.45); tone(1046,.62,1.1,'square',.25); noise(.6,.5,.25,4000); },
    break(){ noise(0,.35,.8,1800); [1568,1319,1046,784,523].forEach((f,i)=>tone(f,i*.05,.12,'square',.35)); tone(98,0,.5,'sawtooth',.4,.5); },
    stamp(){ tone(110,0,.18,'square',.5,.5); noise(0,.1,.5,200); },
    orb(){ tone(1568+Math.random()*400,0,.05,'triangle',.25); },
    equip(){ tone(1175,0,.06,'square',.4); tone(1760,.06,.12,'triangle',.4); },
    whoosh(){ noise(0,.3,.45,1200); },
    record(){ [784,988,1175,1568,1976].forEach((f,i)=>tone(f,i*.06,.14,'square',.4)); },
  };
  const wantAudio = () => !S.profile || S.profile.settings.sound || S.profile.settings.music !== false;
  return {
    ac: () => ac,
    out(){ ctx(); return comp; },
    play(name){
      try {
        if (!(S.profile ? S.profile.settings.sound : true)) return;
        const a = ctx(); if (!a) return; if (a.state === 'suspended') a.resume().catch(()=>{});
        if (P[name]) P[name]();
      } catch(e){}
    },
    unlock(){
      try {
        if (!wantAudio()) return Promise.resolve();
        const a = ctx(); if (!a) return Promise.resolve();
        return a.state === 'running' ? Promise.resolve() : a.resume().catch(()=>{});
      } catch(e){ return Promise.resolve(); }
    }
  };
})();

         C5 E5 G5 C5 E5 G5 C5 E5 G5 C5 E5 G5 C5 E5 G5 E5   G4 B4 D5 G4 B4 D5 G4 B4 D5 G4 B4 D5 G4 B4 D5 B4`,
    bass:`A1 - A2 - A1 - A2 - A1 - A2 - A1 - A2 -   F1 - F2 - F1 - F2 - F1 - F2 - F1 - F2 -
          C2 - C3 - C2 - C3 - C2 - C3 - C2 - C3 -   G1 - G2 - G1 - G2 - G1 - G2 - G1 - G2 -`,
    drums:'k.h.x.h.k.h.x.hh'.repeat(7)+'k.h.x.h.k.x.xxxx' },
  boss: { bpm:144,
    lead:`E5 - B4 E5 G5 F#5 E5 D#5   E5 - G5 - C6 B5 A5 G5   F#5 - A5 D6 C6 B5 A5 F#5   D#5 F#5 B5 - A5 F#5 D#5 B4
          E6 - B5 G5 E5 F#5 G5 B5   C6 - B5 A5 G5 A5 B5 C6   D6 - C6 B5 A5 B5 C6 D6   D#6 - B5 - F#5 - D#5 -`,

    bass:`E2 E2 E3 - E2 E2 E3 - E2 E2 E3 - E2 E2 E3 -   C2 C2 C3 - C2 C2 C3 - C2 C2 C3 - C2 C2 C3 -
          D2 D2 D3 - D2 D2 D3 - D2 D2 D3 - D2 D2 D3 -   B1 B1 B2 - B1 B1 B2 - B1 B1 B2 - B1 B1 B2 -`,
    drums:'k.k.s.kkk.k.s.ss'.repeat(7)+'k.s.s.ssk.s.ssss' },

const NOTE_I = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const nf = t => { const m = /^([A-G][#b]?)(-?\d)$/.exec(t); return m ? 440*Math.pow(2,(NOTE_I[m[1]]+(+m[2]+1)*12-69)/12) : 0; };
function musicSeq(str, eighths){
  let t = str.trim().split(/\s+/);
  if (eighths) t = t.flatMap(x => x==='.' ? ['.','.'] : x==='-' ? ['-','-'] : [x,'-']);
  const by = new Map();
  for (let i=0;i<t.length;i++){ const x=t[i]; if (x==='.'||x==='-') continue; let d=1; while (i+d<t.length && t[i+d]==='-') d++; by.set(i,{f:nf(x),d}); }
  return {len:t.length, by};
}
const musicOn = () => S.profile ? S.profile.settings.music !== false : S.musicPref !== false;
const Music = (() => {
  const cache = {}; let bus=null, timer=0, cur=null, want=null, step=0, nextT=0, trk=null, waves=null, noiseBuf=null;
  function compile(name){
    if (cache[name]) return cache[name];
    const T = TRACKS[name], c = {bpm:T.bpm, lead:musicSeq(T.lead,true), arp:musicSeq(T.arp,false), bass:musicSeq(T.bass,false), drums:T.drums};
    c.len = Math.max(c.lead.len, c.arp.len, c.bass.len, c.drums.length);
    return (cache[name] = c);
  }
  function prep(a){
    if (waves) return;
    const pw = d => { const n=48, re=new Float32Array(n), im=new Float32Array(n); for (let k=1;k<n;k++) re[k]=(2/(k*Math.PI))*Math.sin(k*Math.PI*d); return a.createPeriodicWave(re,im); };
    waves = {p25:pw(.25), p12:pw(.125), p50:pw(.5)};
    noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  function note(a,t,f,dur,wave,vol){
    if (!f) return; const o=a.createOscillator(), g=a.createGain();
    o.setPeriodicWave(wave); o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.006);
    g.gain.exponentialRampToValueAtTime(vol*0.55,t+Math.max(0.02,dur*0.5)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.03);
  }
  function kick(a,t){ const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(42,t+0.12); g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.connect(g); g.connect(bus); o.start(t); o.stop(t+0.18); }
  function hiss(a,t,dur,hp,vol){ const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); s.buffer=noiseBuf; f.type='highpass'; f.frequency.value=hp; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random()*0.5, dur+0.02); }
  function snare(a,t){ hiss(a,t,0.13,1400,0.42); const o=a.createOscillator(), g=a.createGain(); o.type='triangle'; o.frequency.setValueAtTime(190,t); g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.08); o.connect(g); g.connect(bus); o.start(t); o.stop(t+0.1); }
  function sched(a,i,t,sd){
    const c=trk, L=c.lead.by.get(i%c.lead.len), R=c.arp.by.get(i%c.arp.len), B=c.bass.by.get(i%c.bass.len), dr=c.drums[i%c.drums.length];
    if (L) note(a,t,L.f,L.d*sd*0.92,waves.p25,0.16);
    if (R) note(a,t,R.f,R.d*sd*0.8,waves.p12,0.05);
    if (B) note(a,t,B.f,B.d*sd*0.9,waves.p50,0.11);
    if (dr==='k'||dr==='x') kick(a,t);
    if (dr==='s'||dr==='x') snare(a,t);
    if (dr==='h') hiss(a,t,0.035,7000,0.15);
  }
  function tick(){ const a=SFX.ac(); if (!a || !trk || !bus) return; const sd=60/trk.bpm/4; if (nextT<a.currentTime) nextT=a.currentTime+0.05; while (nextT<a.currentTime+0.15){ sched(a,step,nextT,sd); nextT+=sd; step=(step+1)%trk.len; } }
  function halt(){
    clearInterval(timer); timer=0; cur=null; const a=SFX.ac();
    if (bus && a){ const b=bus; try { b.gain.cancelScheduledValues(a.currentTime); b.gain.setValueAtTime(Math.max(0.0001,b.gain.value),a.currentTime); b.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.25); } catch(e){} setTimeout(()=>{ try { b.disconnect(); } catch(e){} },500); }
    bus=null;
  }
  function start(name){
    const a=SFX.ac(); if (!a || a.state!=='running' || !musicOn() || document.hidden || !TRACKS[name]) return;
    halt(); prep(a); trk=compile(name); cur=name;
    bus=a.createGain(); bus.gain.setValueAtTime(0.0001,a.currentTime); bus.gain.exponentialRampToValueAtTime(0.55,a.currentTime+0.6); bus.connect(SFX.out());
    step=0; nextT=a.currentTime+0.08; timer=setInterval(tick,25); tick();
  }
  return {
    play(name){ want=name; if (cur===name && timer) return; if (!musicOn()) { halt(); return; } start(name); },
    stop(){ want=null; halt(); },
    pause(){ halt(); },
    resume(){ if (want && !timer) start(want); },
    sync(){ if (!musicOn()) halt(); else if (want && !timer) start(want); },
  };
})();

/* ============================ STORAGE ============================ */
/* Your save lives in your private per-viewer db subtree when the page runs inside claude.ai.
   Outside it (a saved copy, a preview) it falls back to this browser's storage. */
const LS_KEY = 'locked-in.v1';
const ls = {
  ok(){ try { const k='__li'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; } catch(e){ return false; } },
  get(){ try { return localStorage.getItem(LS_KEY); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(LS_KEY, v); return true; } catch(e){ return false; } },
  del(){ try { localStorage.removeItem(LS_KEY); } catch(e){} },
};
const Store = {
  mode:'memory', db:null, uid:null, profileRef:null, daysCol:null, writers:new Map(), readOnly:false,
  async init(){
    try {
      const c = window.claude;
      if (c && typeof c.use === 'function'){
        const [db, user] = await Promise.all([c.use('db').catch(()=>null), c.use('user').catch(()=>null)]);
        const id = user && typeof user.id === 'function' ? await user.id() : null;
        if (db && id){
          this.db = db; this.uid = id;
          this.profileRef = db.doc(`data/users/${id}/profile`);
          this.daysCol = this.profileRef.collection('days');
          this.mode = 'db'; return;
        }
      }
    } catch(e){ console.warn('store init', e); }
    this.mode = ls.ok() ? 'local' : 'memory';
  },
  async load(){
    if (this.mode === 'db'){
      const [p, q] = await Promise.all([this.profileRef.get(), this.daysCol.orderBy('date','desc').limit(120).get()]);
      const days = {}; let oldest = null;
      for (const d of q.docs){ if (!d.exists) continue; days[d.id] = clone(d.data()); if (!oldest || d.id < oldest) oldest = d.id; }
      return {profile: p.exists ? clone(p.data()) : null, days, allLoaded: q.size < 120, oldest};
    }
    if (this.mode === 'local'){
      const raw = ls.get();
      if (raw){ try { const o = JSON.parse(raw); return {profile:o.profile||null, days:o.days||{}, allLoaded:true}; } catch(e){} }
    }
    return {profile:null, days:{}, allLoaded:true};
  },
  async getDay(k){
    if (this.mode !== 'db') return null;
    try { const s = await this.daysCol.doc(k).get(); return s.exists ? clone(s.data()) : null; } catch(e){ return null; }
  },
  saveProfile(){ this.queue('profile', () => this.profileRef, () => S.profile); },
  saveDay(k){ this.queue('day:'+k, () => this.daysCol.doc(k), () => S.days[k]); },
  queue(key, refFn, dataFn){
    if (this.mode === 'memory' || this.readOnly) return;
    if (this.mode === 'local'){ key = 'local'; dataFn = () => ({profile:S.profile, days:S.days}); }
    let w = this.writers.get(key);
    if (!w){ w = {timer:0, busy:false, dirty:false}; this.writers.set(key, w); }
    w.refFn = refFn; w.dataFn = dataFn; w.dirty = true;
    clearTimeout(w.timer); w.timer = setTimeout(() => this.flush(key), 450);
  },
  async flush(key){
    const w = this.writers.get(key);
    if (!w || w.busy || !w.dirty) return;
    clearTimeout(w.timer); w.busy = true; w.dirty = false;
    try {
      const data = w.dataFn();

  if (wk<2) return [`Train: ${wk} of 2 workouts this week. Each one breaks 3 boss shields.`,'train'];
  if (!q.bounty) return [`Daily bounty: ${bountyFor(k)[1]}.`,''];
  if (!q.drinks) return ['Zero-calorie drinks only today? Check it off tonight.','q-drinks'];
  if (!q.sleep) return ['Last mission: get to bed early enough for 7+ hours.',''];
  return ['Every mission done today. You’re locked in.',''];
}

function niceCeil(v){ for (const s of [500,1000,1500,2000,2500,3000,3500,4000,5000,6000]) if (v<=s) return s; return Math.ceil(v/1000)*1000; }
function kcalChart(){
  const data=kcalSeries(), tg=targets().kcal, W=320, H=164, pl=40, pr=8, pt=16, pb=26;
  const max=niceCeil(Math.max(tg*1.25,...data.map(d=>d.kc))), Y=v=>pt+(H-pt-pb)*(1-v/max), band=(W-pl-pr)/7, bw=Math.min(24,band-12), base=Y(0);

  s+=`<rect x="${pl}" y="${Y(tg*1.05)}" width="${W-pl-pr}" height="${(Y(tg*.8)-Y(tg*1.05)).toFixed(1)}" style="fill:var(--good);opacity:.12"/>`;
  data.forEach((d,i)=>{
    const x=pl+band*i+(band-bw)/2, y=Y(d.kc), h=base-y, today=d.k===S.today;
    if (h>0.5){ const r=Math.min(4,h); s+=`<path d="M${x} ${base}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${base}Z" style="fill:${today?'var(--amber)':'var(--steel)'}"/>`; }
    s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" style="fill:${today?'var(--text)':'var(--muted)'}">${dayName(d.k).slice(0,2)}</text>`;
    if (today && d.kc) s+=`<text x="${x+bw/2}" y="${Math.max(12,y-6)}" text-anchor="middle" style="fill:var(--text)">${fmt(d.kc)}</text>`;
  });
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(tg)}" y2="${Y(tg)}" stroke-width="1.5" stroke-dasharray="5 4" style="stroke:var(--amber)"/><text x="${pl+4}" y="${Y(tg)-5}" style="fill:var(--text)">Target ${fmt(tg)}</text>`;
  data.forEach((d,i)=>{ const x=pl+band*i; s+=`<rect class="hit" x="${x}" y="${pt}" width="${band}" height="${H-pt-pb}" tabindex="0" data-x="${x+band/2}" data-y="${Math.min(Y(d.kc),Y(tg))}" data-v="${d.logged?fmt(d.kc)+' kcal':'Nothing logged'}" data-l="${esc(dayName(d.k,{weekday:'short',month:'short',day:'numeric'}))}${d.logged?' · '+Math.round(d.kc/d.tg*100)+'% of target':''}"><title>${esc(dayName(d.k,{weekday:'long'}))}: ${d.logged?fmt(d.kc)+' kcal':'nothing logged'}</title></rect>`; });

}

function estXp(w, dk){
  const c=w.diffs[dk], mult=w.mult||1; if (c.xp) return c.xp;
  if (w.kind==='deck'){ const suits=byGear(w.suits), avg=Object.values(suits).reduce((a,e)=>a+REP_W[e],0)/4, num=c.half?29:54, perCard=(num+c.face*3+c.ace)/13, reps=perCard*Math.min(52,c.cards); return Math.round(40+(reps*avg+(c.jokers?40:0))*mult); }
  if (w.kind==='ladder'){ const n=c.top*(c.top+1)/2; return Math.round(40+byGear(c.moves).reduce((a,m)=>a+n*REP_W[m],0)*mult); }
  if (w.kind==='count') return Math.round(40+byGear(c.goal)*REP_W[byGear(w.ex)]*mult);
  if (w.kind==='sets'){ const mv=byGear(w.moves); let s=0; mv.forEach((m,i)=>{ s+=REP_W[m]*c.reps[i]*c.rounds; }); return Math.round(40+s*mult); }
  return 60;
}
function getDiff(id){ const w=WORKOUTS.find(x=>x.id===id); let dk=S.profile.diff[id]||'rookie'; const c=w.diffs[dk]; if (!c || (c.lvl && level()<c.lvl)) dk='regular'; return dk; }
function wkMoves(w, dk){
  const c=w.diffs[dk];
  if (w.kind==='deck') return Object.values(byGear(w.suits));
  if (w.kind==='emom') return byGear(c.set).map(x=>x[0]);
  if (w.kind==='ladder') return byGear(c.moves);
  if (w.kind==='count') return [byGear(w.ex)];
  return byGear(w.moves);
}
function lastDone(id){ let last=''; for (const k of Object.keys(S.days)) if ((S.days[k].workouts||[]).some(x=>x.w===id) && k>last) last=k; return last; }

function recentPace(){
  const cut=addDays(S.today,-42), ws=S.profile.weights.filter(w=>w.d>=cut); if (ws.length<2) return null;
  const x=ws.map(w=>pkey(w.d).getTime()/864e5), y=ws.map(w=>w.lb); if (x[x.length-1]-x[0]<10) return null;
  const mx=x.reduce((a,b)=>a+b)/x.length, my=y.reduce((a,b)=>a+b)/y.length; let num=0, den=0;
  for (let i=0;i<x.length;i++){ num+=(x[i]-mx)*(y[i]-my); den+=(x[i]-mx)**2; }
  return den ? -num/den*7 : null;
}
function weightChart(){
  const ws=S.profile.weights.slice(-60), goal=+S.profile.body.goalWeight||0;
  if (ws.length<2) return `<p class="empty" style="margin-top:12px">Log a second weigh-in and your trend line shows up here.</p>`;
  const W=320, H=176, pl=40, pr=12, pt=14, pb=26, xs=ws.map(w=>pkey(w.d).getTime()), x0=xs[0], span=Math.max(864e5,xs[xs.length-1]-x0), vals=ws.map(w=>w.lb);
  let e=vals[0]; const tr=vals.map(v=>(e=e+0.35*(v-e)));
  let lo=Math.min(...vals,...tr), hi=Math.max(...vals,...tr); const showGoal=goal && goal>=lo-12; if (showGoal) lo=Math.min(lo,goal);
  const padv=Math.max(1,(hi-lo)*.12); lo=Math.floor(lo-padv); hi=Math.ceil(hi+padv);
  const X=t=>pl+(W-pl-pr)*((t-x0)/span), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend from ${fmt1(vals[0])} to ${fmt1(vals[vals.length-1])} pounds">`;
  for (const v of [lo,Math.round((lo+hi)/2),hi]){ const y=Y(v); s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke-width="1" style="stroke:var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`; }
  s+=`<text x="${pl}" y="${H-8}">${esc(dayName(ws[0].d,{month:'short',day:'numeric'}))}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${esc(dayName(ws[ws.length-1].d,{month:'short',day:'numeric'}))}</text>`;
  if (showGoal){ const y=Y(goal); s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke-width="1.5" stroke-dasharray="5 4" style="stroke:var(--good)"/><text x="${W-pr}" y="${y-5}" text-anchor="end" style="fill:var(--text)">Goal ${fmt1(goal)}</text>`; }
  s+=`<path d="${tr.map((v,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(v).toFixed(1)).join('')}" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--amber)"/>`;
  ws.forEach((w,i)=>{ const x=X(xs[i]), y=Y(w.lb); s+=`<rect x="${(x-5).toFixed(1)}" y="${(y-5).toFixed(1)}" width="10" height="10" style="fill:var(--ink-2)"/><rect x="${(x-3).toFixed(1)}" y="${(y-3).toFixed(1)}" width="6" height="6" style="fill:var(--amber)"/>`; });
  ws.forEach((w,i)=>{ const x=X(xs[i]), prev=i?X(xs[i-1]):pl, next=i<ws.length-1?X(xs[i+1]):W-pr, a=(x+prev)/2, b=(x+next)/2; s+=`<rect class="hit" x="${(i?a:pl).toFixed(1)}" y="${pt}" width="${Math.max(24,(i<ws.length-1?b:W-pr)-(i?a:pl)).toFixed(1)}" height="${H-pt-pb}" tabindex="0" data-x="${x.toFixed(1)}" data-y="${Y(w.lb).toFixed(1)}" data-v="${fmt1(w.lb)} lb" data-l="${esc(dayName(w.d,{month:'short',day:'numeric'}))} · trend ${fmt1(tr[i])}${w.waist?' · waist '+fmt1(w.waist)+' in':''}"><title>${esc(dayName(w.d,{month:'short',day:'numeric'}))}: ${fmt1(w.lb)} lb</title></rect>`; });
  return `<div class="chart">${s}</svg><div class="tt" hidden></div></div><div class="legend"><span><i class="kd"></i>Weigh-in</span><span><i class="kl"></i>Trend</span>${showGoal?'<span><i class="kg"></i>Goal</span>':''}</div>`;
}

function afItems(){

  if (cat==='recent') return S.profile.recent.slice();
  if (cat==='all') return all; if (cat==='mine') return mine;
  return all.filter(f=>f.c===cat);
}

function timeInputVal(ts){ const d=new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function tsFromTime(v, ref=Date.now()){ const m=/^(\d{1,2}):(\d{2})/.exec(v||''); if (!m) return null; const d=new Date(ref); d.setHours(+m[1],+m[2],0,0); if (d.getTime()>ref+60000) d.setDate(d.getDate()-1); return d.getTime(); }
function openFastStart(){
  const plan=fastPlan(); if (!plan) return;
  openSheet(`<h2>Start fast</h2><p class="muted" style="font-size:13px">Start it right after your last bite of the day.</p>
    <div class="stack"><label class="field"><span>Last bite at</span><input class="inp" id="fs-t" type="time" value="${timeInputVal(Date.now())}"></label>
    <p class="fine" id="fs-note">Goal: ${plan.h} hours.</p><p class="err" id="fs-err"></p>
    <button class="btn block" data-act="fast-start-go">Start the timer</button></div>`);
}
function fastStartGo(){
  const plan=fastPlan(), s=tsFromTime($('#fs-t').value);
  if (!s){ $('#fs-err').textContent='Pick a time.'; return; }
  if (Date.now()-s>20*3600e3){ $('#fs-err').textContent='That’s more than 20 hours ago. Pick a time from today or last night.'; return; }
  S.profile.fasting.active={s, goal:plan.h}; closeSheet(); Store.saveProfile();
  const hk=checkFastGoal(); if (hk) commit([hk]); else render();
  SFX.play('go'); toast(`Fast started. Done at ${clockLabel(s+plan.h*3600e3)}.`);
}
function openFastEnd(){
  const a=fastActive(); if (!a) return;
  openSheet(`<h2>End fast</h2><p class="muted" style="font-size:13px">Started ${clockLabel(a.s)} · ${hmLabel(fastElapsed())} so far.</p>
    <div class="stack"><label class="field"><span>First bite at</span><input class="inp" id="fe-t" type="time" value="${timeInputVal(Date.now())}"></label>
    <p class="err" id="fe-err"></p><button class="btn block" data-act="fast-end-go">End fast</button></div>`);
}
function fastEndGo(){
  const a=fastActive(); if (!a) return; const e=tsFromTime($('#fe-t').value);
  if (!e || e<=a.s){ $('#fe-err').textContent=`Pick a time after ${clockLabel(a.s)}.`; return; }
  closeSheet(); endFast(e);
}
function endFast(e, {quiet=false}={}){
  const p=S.profile, a=p.fasting.active; if (!a) return;
  const g=a.goal||fastGoalH(), hit=(e-a.s)>=g*3600e3, k=dkey(new Date(e)), hk=dkey(new Date(a.s+g*3600e3)), days=[k];
  const before=totalXp();
  const d=day(k); d.fasts.push({s:a.s, e, goal:g, hit});
  if (hit){ const hd=day(hk); if (!(hd.fastHit && hd.fastHit.s===a.s)){ hd.fastHit={s:a.s, goal:g}; p.stats.fasts=(p.stats.fasts||0)+1; if (!days.includes(hk)) days.push(hk); } }
  p.fasting.active=null;
  commit(days);
  if (!quiet){ const gain=totalXp()-before; if (gain>0) floatXp(gain); SFX.play(hit?'coin':'undo'); toast(hit?`Fast complete: ${hmLabel((e-a.s)/1000)}. Nice work.`:`Fast ended at ${hmLabel((e-a.s)/1000)}. Goal was ${g} hours, try again tonight.`); }
}

/* Height: accepts 5'7, 5’7”, 5 7, 5-7, 5.7, 57, 5ft 7in, 511, 67in or 170cm */
function parseHeight(raw){
  const s=String(raw||'').trim().toLowerCase().replace(/[’‘′`´]/g,"'").replace(/[”“″]/g,'"').replace(/''/g,'"').replace(/\s+/g,' ');
  if (!s) return null;
  const ok=(ft,inch)=>(ft>=4&&ft<=7&&inch>=0&&inch<=11)?{ft,inch}:null, fromIn=t=>ok(Math.floor(t/12),t%12), fromCm=cm=>(cm>=120&&cm<=230)?fromIn(Math.round(cm/2.54)):null;
  let m;
  if ((m=/^(\d{3})(?:\.\d+)?\s?cm$/.exec(s))) return fromCm(+m[1]);
  if ((m=/^(\d)\s?(?:'|ft\.?|feet|foot)\s?(\d{1,2})\s?(?:"|in\.?|inch|inches)?$/.exec(s))) return ok(+m[1],+m[2]);
  if ((m=/^(\d)(?:\s|-|,|\.)(\d{1,2})$/.exec(s))) return ok(+m[1],+m[2]);

  const s=w.seq[w.si]; if (s.type==='rest'){ w.restAt=wkElapsed(); SFX.play('beep'); w.stage.anim=null; } else { SFX.play('go'); w.stage.anim={type:'rep'}; }
  renderWk();
}
function wkPrimary(){
  const w=S.wk; if (!w || w.phase==='done') return;
  if (w.kind==='deck'){
    if (w.phase==='ready'){ wkStart(); w.i=0; }
    else { const r=cardReps(w.deck[w.i],w); w.reps[r.ex]=(w.reps[r.ex]||0)+r.n; w.i++; if (w.i>=w.deck.length) return wkFinish(true); }
    w.flip=true; SFX.play('card');
  } else if (w.kind==='emom' || w.kind==='circuit'){
    if (w.phase==='ready'){ wkStart(); SFX.play('go'); } else return wkPause();
  } else if (w.kind==='ladder'){
    if (w.phase==='ready'){ wkStart(); SFX.play('go'); }
    else { for (const m of w.moves) w.reps[m]=(w.reps[m]||0)+w.rung; w.rung--; SFX.play('blip'); if (w.rung<1) return wkFinish(true); }
  } else if (w.kind==='count'){ if (w.phase==='ready'){ wkStart(); SFX.play('go'); } }
  else if (w.kind==='sets'){
    if (w.phase==='ready'){ wkStart(); w.si=-1; return setsAdvance(); }
    const s=w.seq[w.si]; if (s.type==='work') w.reps[s.ex]=(w.reps[s.ex]||0)+s.n;
    return setsAdvance();
  }
