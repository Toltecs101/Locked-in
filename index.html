}
function wkCount(n){ const w=S.wk; if (!w || w.phase!=='run') return; w.count=clamp(w.count+n,0,999); w.reps[w.ex]=w.count; SFX.play(n>0?'blip':'undo'); if (w.count>=w.goal) return wkFinish(true); renderWkMain(); wkTick(); }
function setProg(f){ const p=$('#wk-prog'); if (p) p.style.width=(clamp(f,0,1)*100).toFixed(1)+'%'; }
function wkTick(){
  const w=S.wk; if (!w) return;
  const el=wkElapsed(), ck=$('#wk-clock'); if (ck) ck.textContent=mmss(el);
  if (w.phase!=='run') return;
  if (w.kind==='deck') return setProg(w.i/w.deck.length);
  if (w.kind==='ladder') return setProg((w.cfg.top-w.rung)/w.cfg.top);
  if (w.kind==='count') return setProg(w.count/w.goal);
  if (w.kind==='sets'){
    setProg(w.seq.slice(0,Math.max(0,w.si)).filter(s=>s.type==='work').length/w.works);
    const s=w.seq[w.si]; if (!s || s.type!=='rest') return;
    const left=Math.max(0,Math.ceil(s.dur-(el-w.restAt))), bc=$('#wk-big'); if (bc){ bc.textContent=left; bc.classList.toggle('hot',left<=3); }
    if (left<=3 && left>0 && w.beep!==left){ w.beep=left; SFX.play('beep'); }
    if (left<=0) setsAdvance();
    return;
  }
  if (w.paused) return;
  if (w.kind==='emom'){
    const r=Math.floor(el/60); if (r>=w.cfg.rounds) return wkFinish(true);
    if (r!==w.round){ if (w.round>=0) SFX.play('go'); w.round=r; renderWkMain(); }
    const sec=Math.max(1,Math.ceil(60-(el%60))); if (sec<=3 && w.beep!==r*100+sec){ w.beep=r*100+sec; SFX.play('beep'); }
    const bc=$('#wk-big'); if (bc){ bc.textContent=sec; bc.classList.toggle('hot',sec<=10); }
    setProg(el/w.total);
  } else if (w.kind==='circuit'){
    let acc=0, idx=0; while (idx<w.seq.length && el>=acc+w.seq[idx].dur){ acc+=w.seq[idx].dur; idx++; }
    if (idx>=w.seq.length) return wkFinish(true);
    if (idx!==w.si){ w.si=idx; w.worksDone=w.seq.slice(0,idx).filter(s=>s.type==='work').length; if (idx>0) SFX.play(w.seq[idx].type==='work'?'go':'beep'); renderWkMain(); }
    const sec=Math.max(1,Math.ceil(acc+w.seq[idx].dur-el)); if (sec<=3 && w.beep!==idx*100+sec){ w.beep=idx*100+sec; SFX.play('beep'); }
    const bc=$('#wk-big'); if (bc){ bc.textContent=sec; bc.classList.toggle('hot',sec<=3); }
    setProg(el/w.total);
  }
}
function wkXp(){
  const w=S.wk; if (w.kind==='emom' || w.kind==='circuit') return Math.round(w.cfg.xp*clamp(w.frac,0,1));

}
function wkFinish(complete){
  const w=S.wk; if (!w || w.phase==='done') return;

  if (w.kind==='emom'){ const rd=complete?w.cfg.rounds:Math.floor(w.elapsed/60); w.roundsDone=rd; w.frac=rd/w.cfg.rounds; w.reps={}; for (const [ex,n] of w.set) w.reps[ex]=n*rd; }
  if (w.kind==='circuit'){ const wd=complete?w.works:(w.worksDone||0); w.frac=wd/w.works; }
  w.xp=wkXp();
  const key=prKey(w.def.id,w.dk), best=S.profile.prs[key];

  } else SFX.play('undo');
}
function wkEnd(){ const w=S.wk; if (!w) return; if (w.phase==='ready') return wkClose(); wkFinish(false); }

function wkClose(){ const w=S.wk; if (!w) return; clearInterval(w.timer); if (w.stage) Loop.remove(w.stage); releaseWake(); S.wk=null; closeFull(); Music.play('yard'); }

  document.addEventListener('focusin',e=>{ const h=e.target.closest && e.target.closest('.hit'); if (h) showTT(h); });
  document.addEventListener('pointerout',e=>{ if (e.pointerType==='touch') return; const c=e.target.closest && e.target.closest('.chart'); if (c && !c.contains(e.relatedTarget)){ const tt=c.querySelector('.tt'); if (tt) tt.hidden=true; } });
  let rsT=0; window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if (scene && !$('#scene-win').hidden) scene.resize(); for (const s of [S.previewStage,S.lvlStage,S.btStage,S.bossStage,S.lockStage,S.chest&&S.chest.stage,S.wk&&S.wk.stage]) if (s) s.resize(); },150); });
  document.addEventListener('visibilitychange',()=>{ if (document.hidden){ Store.flushAll(); Music.pause(); } else { tickClock(); Music.resume(); } });
  window.addEventListener('pagehide',()=>Store.flushAll());
}
function setupTabs(){ const T={today:['home','Today'],eat:['chow','Eat'],train:['yard','Train'],me:['me','Me']}; for (const [k,[ic,l]] of Object.entries(T)) $('#tab-'+k).innerHTML=icon(ic)+`<span>${l}</span>`; }
function tickClock(){
  if (!S.profile) return;
  const k=dkey();
  if (k!==S.today){
    const prev=S.today; S.today=k; if (S.chowDate===prev) S.chowDate=k; refreshDayXp(prev);
    const used=applyShields(); checkBadges(); Store.saveProfile(); S.lastLevel=Math.max(S.lastLevel,level()); render();
    if (used) toast(`A streak shield covered yesterday. Your ${streak()}-day streak is safe.`);
  }
  const hk=checkFastGoal();
  if (hk){ commit([hk]); fastCelebrate(); }
  else if (S.tab==='today' || (S.tab==='eat' && S.eatSeg==='fast')) render(); else renderHud();
  if (scene) scene.setTOD();
}
function tickFast(){
  const b=$('#fast-big'); if (b && fastActive()) b.textContent=hmLabel(fastElapsed());
  const c=$('#chest-cd'); if (c) c.textContent=hmLabel(secsToMidnight());
}

/* ============================ BOOT ============================ */
async function loadSave(){
  $('#boot-body').innerHTML=`${LOGO}<p class="center muted" style="margin-top:16px">Loading your save…</p>`;
  let data;
  try { data=await Store.load(); }
  catch(e){ console.warn(e); $('#boot-body').innerHTML=`${LOGO}<div class="pitch"><p class="center muted">Couldn’t reach your save just now.</p><button class="btn block" data-act="retry-load">Try again</button></div>`; return; }
  S.days={}; for (const [k,d] of Object.entries(data.days||{})) S.days[k]=norm(d);
  S.allLoaded=data.allLoaded!==false; S.oldest=data.oldest||null; S.today=dkey(); S.chowDate=S.today;
  if (!data.profile){ showTitle(); return; }
  S.profile=migrate(data.profile);
  const used=applyShields();
  const fk=checkFastGoal(); if (fk) Store.saveDay(fk);
  let changed=!!used||!!fk; for (const k of Object.keys(S.days)) if (refreshDayXp(k)) changed=true; if (refreshDayXp(S.today)) changed=true;
  const earned=checkBadges(); if (earned.length || changed) Store.saveProfile();
  S.lastLevel=level(); enterApp();
  let delay=900;
  if (used){ setTimeout(()=>toast(`A streak shield covered a missed day. Your ${streak()}-day streak is safe.`),delay); delay+=1800; }
  if (fk){ setTimeout(fastCelebrate,delay); delay+=1800; }
  earned.forEach((b,i)=>setTimeout(()=>toast(`Badge unlocked: ${b[1]}. +50 XP`),delay+i*1700));
}
async function start(hot){
  const h=location.hash.slice(1), want=(hot&&hot.tab)||h;
  S.tab=TABS.includes(want)?want:(OLD_TABS[want]||'today');
  setupTabs(); bindEvents();
  scene=new YardScene($('#scene')); scene.hero=heroOpts(DEFAULT_HERO,{}); scene.resize(); Loop.add(scene);
  try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot==='function') window.claude.hot.snapshot(()=>({tab:S.tab})); } catch(e){}
  await Store.init();
  await loadSave();
  setInterval(tickClock,30000); setInterval(tickFast,1000);
}
(function boot(){
  const go=d=>{ start(d||{}).catch(e=>console.error(e)); };
  const hot=window.claude && window.claude.hot;
  if (hot && typeof hot.ready==='function') hot.ready(go); else go((hot && hot.data) || {});
})();

</script>
